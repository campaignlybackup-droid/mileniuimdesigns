<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 107" width="1024" height="107">
  <style>
    .tone-green { display: block; }
    .tone-ivory { display: none; }
    :root[data-tone="ivory"] .tone-green { display: none; }
    :root[data-tone="ivory"] .tone-ivory { display: block; }
    [data-tone="ivory"] .tone-green { display: none; }
    [data-tone="ivory"] .tone-ivory { display: block; }
  </style>
  <image class="tone-green" width="1024" height="107" href="data:image/png;base64," />
  <image class="tone-ivory" width="1024" height="107" href="data:image/png;base64," />
</svg>